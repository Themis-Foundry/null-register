<text x="64" y="152" fill="#8fa3c4" font-size="16">The bar is the average. The whisker is the range the data actually supports.<tspan x="64" dy="22">A whisker touching the line means the signal has not shown it does anything at all.</tspan><tspan x="64" dy="22">The rebound that paid +12.4% is also the widest bar here, and that is the point.</tspan></text>
